name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "store/**"
      - ".github/RELEASE.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "store/**"
      - ".github/RELEASE.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble rustore debug
        run: ./gradlew :app:assembleRustoreDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tomilo-rustore-debug
          path: app/build/outputs/apk/rustore/debug/*.apk
          if-no-files-found: error
          retention-days: 14
